  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iterations, hash: 'SHA-256'},
    material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(DATA.nonce)}, key, bytes(DATA.text));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
function stored() { try { return localStorage.getItem(KEY); } catch (error) { return null; } }
function store(value) { try { value ? localStorage.setItem(KEY, value) : localStorage.removeItem(KEY); } catch (error) {} }
form.onsubmit = async event => {
  event.preventDefault();
  const password = form.password.value;
  status.textContent = 'Opening…';
  try { await open(password); store(form.remember.checked ? password : null); }
  catch (error) { status.textContent = 'That password does not open this page.'; }
};
if (stored()) open(stored()).catch(() => store(null));
